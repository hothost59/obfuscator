<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cool obfuscator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f11;
      --bg2: #16161a;
      --bg3: #1e1e24;
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.14);
      --text: #e8e6f0;
      --muted: #7a7890;
      --dim: #4a4860;
      --purple: #7f77dd;
      --purple-light: #afa9ec;
      --purple-dark: #533ab7;
      --green: #1d9e75;
      --coral: #d85a30;
      --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 28px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg2);
    }

    .logo {
      width: 28px;
      height: 28px;
      background: var(--purple-dark);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .05em;
    }

    .sub {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 14px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .12em;
      flex-shrink: 0;
    }

    footer {
      padding: 10px 28px;
      border-top: 0.5px solid var(--border);
      font-size: 10px;
      color: var(--dim);
      display: flex;
      gap: 16px;
    }

    .dg {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .shell {
      width: min(1400px, calc(100% - 48px));
      margin: 0 auto;
      padding: 20px 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .eyebrow,
    .lede,
    .hero-card,
    .section-title,
    .stack,
    .source-list {
      display: none;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--purple-dark);
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .mode-switch button,
    .toggle,
    .btn,
    .copy-btn {
      font: inherit;
    }

    .mode-switch button {
      padding: 5px 14px;
      font-size: 11px;
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      background: var(--bg2);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
    }

    .mode-switch button.active {
      background: var(--purple-dark);
      color: #fff;
      border-color: var(--purple-dark);
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 0.5px solid var(--border2);
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      color: var(--muted);
      user-select: none;
      transition: all 0.15s;
      background: var(--bg);
    }

    .toggle.active {
      border-color: var(--purple);
      color: var(--purple-light);
      background: rgba(127, 119, 221, 0.08);
    }

    .toggle.warn {
      border-style: dashed;
    }

    .toggle.warn.active {
      border-color: var(--coral);
      color: var(--coral);
      background: rgba(216, 90, 48, 0.08);
    }

    .mode-switch button:hover:not(.active),
    .toggle:hover:not(.active),
    .actions button:hover,
    .copy-btn:hover {
      color: var(--text);
    }

    input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--purple);
    }

    select,
    textarea {
      width: 100%;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
    }

    select:focus,
    textarea:focus,
    .copy-btn:focus,
    .mode-switch button:focus,
    .preset button:focus,
    .actions button:focus {
      border-color: var(--purple);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toolbar-left,
    .toolbar-right,
    .action-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg);
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .chip strong {
      color: var(--purple-light);
      font-weight: 600;
    }

    .panels {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .pane {
      display: grid;
      gap: 6px;
    }

    .panel {
      position: relative;
      min-width: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 400;
    }

    .panel-hint,
    .empty-state,
    .stats,
    .meta {
      display: none;
    }

    textarea {
      min-height: 340px;
      resize: vertical;
      padding: 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      white-space: pre;
      tab-size: 2;
      min-width: 0;
    }

    textarea::placeholder {
      color: var(--dim);
    }

    textarea[readonly] {
      background: var(--bg3);
    }

    textarea::-webkit-scrollbar {
      width: 5px;
    }

    textarea::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px;
    }

    .output-wrap {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      background: var(--bg2);
      color: var(--text);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
    }

    .empty-state {
      position: absolute;
      inset: 50px 14px auto 14px;
      pointer-events: none;
      color: var(--dim);
      font-size: 11px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      padding: 8px 18px;
      font-size: 12px;
      border: 0.5px solid var(--border2);
      border-radius: 6px;
      background: var(--bg2);
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s;
    }

    .actions button.primary {
      background: var(--purple-dark);
      color: #fff;
      border-color: var(--purple-dark);
      font-weight: 600;
    }

    .status {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    .status.error {
      color: var(--coral);
    }

    .footer-note {
      margin-top: 14px;
      color: var(--dim);
      font-size: 10px;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .advanced {
      display: none !important;
    }

    @media (max-width: 980px) {

      .hero,
      .workspace,
      .panels {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }
    }

    @media (max-width: 700px) {
      h1 {
        line-height: 1;
      }

      textarea {
        min-height: 280px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">⊛</div>
    <h1>super cool obfuscator</h1>
    <span class="sub" id="modeLbl">mode: javascript</span>
  </header>
  <main>
    <div class="row">
      <span class="label">mode</span>
      <div class="mode-switch" role="tablist" aria-label="Obfuscation mode">
        <button class="active" data-mode="javascript" type="button">javascript</button>
        <button data-mode="html" type="button">html</button>
      </div>
    </div>

    <div class="row advanced">
      <span class="label">passes</span>
      <div class="toggle active" id="opt-compact"><span class="dot"></span>compact</div>
      <div class="toggle active" id="opt-string-array"><span class="dot"></span>strings</div>
      <div class="toggle active" id="opt-split"><span class="dot"></span>split</div>
      <div class="toggle" id="opt-control-flow"><span class="dot"></span>flow</div>
      <div class="toggle" id="opt-dead-code"><span class="dot"></span>dead code</div>
    </div>

    <div class="row advanced">
      <span class="label">html</span>
      <div class="toggle active" id="opt-inline-js"><span class="dot"></span>inline js</div>
      <div class="toggle active" id="opt-strip-ws"><span class="dot"></span>trim html</div>
      <div class="toggle active" id="preset-balanced"><span class="dot"></span>balanced</div>
      <div class="toggle" id="preset-light"><span class="dot"></span>light</div>
      <div class="toggle" id="preset-hard"><span class="dot"></span>hard</div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-label" id="srcLbl">source</span>
          <span class="panel-hint" id="source-meta"></span>
        </div>
        <textarea id="source" spellcheck="false" placeholder="// paste JavaScript or HTML here..."></textarea>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-label">output</span>
          <span class="panel-hint" id="output-meta"></span>
        </div>
        <textarea id="output" spellcheck="false" readonly placeholder="// obfuscated output appears here..."></textarea>
        <div class="empty-state" id="empty-state">No output yet. Click Obfuscate after pasting source.</div>
      </div>
    </div>

    <div class="row">
      <div class="actions">
        <button class="btn primary" id="obfuscate-btn">obfuscate</button>
        <button class="btn" id="copy-output">copy</button>
        <button class="btn" id="download-btn">save</button>
        <button class="btn ghost2" id="clear-input">clear</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="status" id="status">Waiting for input.</div>
    </div>
  </main>
  <footer>
    <span><span class="dg"></span> i know, very cool</span>
  </footer>
  <script>
    const state = {
      mode: "javascript",
      preset: "balanced",
    };

    const els = {
      source: document.getElementById("source"),
      output: document.getElementById("output"),
      status: document.getElementById("status"),
      stats: document.getElementById("stats"),
      outputMeta: document.getElementById("output-meta"),
      sourceMeta: document.getElementById("source-meta"),
      emptyState: document.getElementById("empty-state"),
      modeLbl: document.getElementById("modeLbl"),
      obfuscateBtn: document.getElementById("obfuscate-btn"),
      copyBtn: document.getElementById("copy-output"),
      downloadBtn: document.getElementById("download-btn"),
    };

    const sampleJs = `function greet(name) {
  const parts = ["Hello", name, "from", "Obscura Studio"];
  console.log(parts.join(" "));
  return parts.length;
}

greet("world");`;

    const sampleHtml = `<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample</title>
  </head>
  <body>
    <h1>Secret landing page</h1>
    <script>
      const msg = "This inline script can be obfuscated too.";
      console.log(msg);
    <\/script>
  </body>
</html>`;

    function setStatus(message, kind = "") {
      els.status.textContent = message;
      els.status.className = kind ? `status ${kind}` : "status";
    }

    function updateCounts() {
      els.stats.innerHTML =
        '<span class="stat-item">input <span class="sv">' + els.source.value.length + '</span></span> ' +
        '<span class="stat-item">output <span class="sv">' + els.output.value.length + '</span></span>';
    }

    function setOutput(value, note = "") {
      els.output.value = value;
      els.emptyState.style.display = value ? "none" : "block";
      els.outputMeta.textContent = note || (value ? "Generated" : "Ready when you are");
      updateCounts();
    }

    function escapeForSingleQuotes(text) {
      return text.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function uid(len = 7) {
      const chars = "_$abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const pool = chars + "0123456789";
      let out = chars[Math.floor(Math.random() * chars.length)];
      for (let i = 1; i < len; i += 1) {
        out += pool[Math.floor(Math.random() * pool.length)];
      }
      return out;
    }

    function buildJsOptions() {
      const compact = document.getElementById("opt-compact").classList.contains("active");
      const stringArray = document.getElementById("opt-string-array").classList.contains("active");
      const splitStrings = document.getElementById("opt-split").classList.contains("active");
      const controlFlowFlattening = true;
      const deadCodeInjection = true;

      const options = {
        compact,
        strings: stringArray,
        splitStrings,
        controlFlowFlattening,
        deadCodeInjection,
        rename: true,
      };

      if (state.preset === "light") {
        options.compact = false;
        options.strings = false;
        options.splitStrings = false;
        options.controlFlowFlattening = false;
        options.deadCodeInjection = false;
      }

      if (state.preset === "hard") {
        options.compact = true;
        options.strings = true;
        options.splitStrings = true;
        options.controlFlowFlattening = true;
        options.deadCodeInjection = true;
      }

      return options;
    }

    function buildPasses() {
      return buildJsOptions();
    }

    const RX_AFTER = new Set([
      "=", "+=", "-=", "*=", "/=", "%=", "==", "===", "!=", "!==",
      "<", "<=", ">", ">=", "&&", "||", "??", "!", "~", "&", "|", "^",
      "%", "+", "-", "*", "**", "(", "[", "{", ",", ";", ":", "?", "=>",
      "return", "typeof", "instanceof", "in", "of", "new", "delete",
      "throw", "void", "case", "yield", "await",
    ]);

    function tokenise(src) {
      const toks = [];
      let i = 0;
      const n = src.length;
      let last = null;

      function canRx() {
        return last === null || RX_AFTER.has(last);
      }

      while (i < n) {
        const c = src[i];

        if (c === " " || c === "\t" || c === "\r" || c === "\n") {
          let s = "";
          while (i < n && (src[i] === " " || src[i] === "\t" || src[i] === "\r" || src[i] === "\n")) {
            s += src[i++];
          }
          toks.push({ t: "ws", v: s });
          continue;
        }

        if (c === "/" && src[i + 1] === "/") {
          let s = "";
          i += 2;
          while (i < n && src[i] !== "\n") s += src[i++];
          toks.push({ t: "cmt", v: "//" + s });
          continue;
        }

        if (c === "/" && src[i + 1] === "*") {
          let s = "/*";
          i += 2;
          while (i < n && !(src[i] === "*" && src[i + 1] === "/")) s += src[i++];
          s += "*/";
          i += 2;
          toks.push({ t: "cmt", v: s });
          continue;
        }

        if (c === "`") {
          let s = "`";
          i += 1;
          while (i < n) {
            const x = src[i];
            if (x === "\\") {
              s += x + (src[i + 1] || "");
              i += 2;
              continue;
            }
            s += x;
            i += 1;
            if (x === "`") break;
          }
          toks.push({ t: "tpl", v: s });
          last = s;
          continue;
        }

        if (c === '"' || c === "'") {
          const q = c;
          let s = c;
          i += 1;
          while (i < n) {
            const x = src[i];
            if (x === "\\") {
              s += x + (src[i + 1] || "");
              i += 2;
              continue;
            }
            s += x;
            i += 1;
            if (x === q) break;
          }
          toks.push({ t: "str", v: s });
          last = s;
          continue;
        }

        if (c === "/" && canRx()) {
          let s = "/";
          i += 1;
          let inC = false;
          while (i < n) {
            const x = src[i];
            if (x === "\\") {
              s += x + (src[i + 1] || "");
              i += 2;
              continue;
            }
            if (x === "[") inC = true;
            if (x === "]") inC = false;
            s += x;
            i += 1;
            if (x === "/" && !inC) break;
          }
          while (i < n && /[gimsuyv]/.test(src[i])) s += src[i++];
          toks.push({ t: "rx", v: s });
          last = s;
          continue;
        }

        if (/[a-zA-Z_$]/.test(c)) {
          let s = "";
          while (i < n && /[a-zA-Z0-9_$]/.test(src[i])) s += src[i++];
          toks.push({ t: "ident", v: s });
          last = s;
          continue;
        }

        if (/[0-9]/.test(c)) {
          let s = "";
          while (i < n && /[0-9a-fA-FxXoObB._eE]/.test(src[i])) s += src[i++];
          toks.push({ t: "other", v: s });
          last = s;
          continue;
        }

        const t3 = src.slice(i, i + 3);
        if (["===", "!==", "**=", "<<=", ">>="].includes(t3)) {
          toks.push({ t: "other", v: t3 });
          last = t3;
          i += 3;
          continue;
        }

        const t2 = src.slice(i, i + 2);
        if (["==", "!=", "<=", ">=", "&&", "||", "??", "+=", "-=", "*=", "/=", "%=", "**", "++", "--", "<<", ">>", "&=", "|=", "^=", "=>", "?."].includes(t2)) {
          toks.push({ t: "other", v: t2 });
          last = t2;
          i += 2;
          continue;
        }

        toks.push({ t: "other", v: c });
        last = c;
        i += 1;
      }

      return toks;
    }

    function passStripComments(toks) {
      return toks.filter((t) => t.t !== "cmt");
    }

    function passEncodeStrings(toks, stName) {
      let idx = 0;
      const table = [];
      const out = toks.map((t) => {
        if (t.t !== "str") return t;
        const inner = t.v.slice(1, -1);
        table.push(JSON.stringify(inner));
        return { t: "other", v: `${stName}[${idx++}]` };
      });
      return { toks: out, table };
    }

    const JS_KW = new Set([
      "break", "case", "catch", "continue", "debugger", "default", "delete", "do", "else",
      "finally", "for", "function", "if", "in", "instanceof", "new", "return", "switch",
      "this", "throw", "try", "typeof", "var", "void", "while", "with", "class", "const",
      "enum", "export", "extends", "import", "super", "implements", "interface", "let",
      "package", "private", "protected", "public", "static", "yield", "async", "await",
      "of", "from", "true", "false", "null", "undefined", "NaN", "Infinity", "arguments", "eval"
    ]);

    const SAFE_G = new Set([
      "window", "document", "navigator", "location", "history", "screen", "console",
      "alert", "confirm", "prompt", "print", "setTimeout", "clearTimeout", "setInterval",
      "clearInterval", "requestAnimationFrame", "cancelAnimationFrame", "queueMicrotask",
      "Promise", "Proxy", "Reflect", "Symbol", "BigInt", "Map", "Set", "WeakMap", "WeakSet",
      "Array", "Object", "Function", "String", "Number", "Boolean", "RegExp", "Date", "Math", "JSON",
      "parseInt", "parseFloat", "isNaN", "isFinite", "encodeURIComponent", "decodeURIComponent",
      "encodeURI", "decodeURI", "btoa", "atob", "crypto", "performance", "Blob", "File", "FileReader",
      "URL", "FormData", "Headers", "Request", "Response", "Event", "CustomEvent", "Element",
      "HTMLElement", "Document", "Node", "NodeList", "localStorage", "sessionStorage", "globalThis",
      "self", "top", "parent", "module", "exports", "require", "process", "Buffer", "global",
    ]);

    function canRename(n) {
      return n.length > 0 && !JS_KW.has(n) && !SAFE_G.has(n);
    }

    function passRename(toks) {
      const map = {};

      function skipWS(j) {
        while (j < toks.length && (toks[j].t === "ws" || toks[j].t === "cmt")) j += 1;
        return j;
      }

      for (let i = 0; i < toks.length; i += 1) {
        const t = toks[i];
        if (t.t !== "ident") continue;

        if (t.v === "var" || t.v === "let" || t.v === "const") {
          const j = skipWS(i + 1);
          if (j < toks.length && toks[j].t === "ident" && canRename(toks[j].v) && !map[toks[j].v]) {
            map[toks[j].v] = uid(6);
          }
        }

        if (t.v === "function") {
          let j = skipWS(i + 1);
          if (j < toks.length && toks[j].t === "ident" && toks[j].v !== "(") {
            if (canRename(toks[j].v) && !map[toks[j].v]) map[toks[j].v] = uid(6);
            let k = j + 1;
            while (k < toks.length && toks[k].v !== "(") k += 1;
            k += 1;
            while (k < toks.length && toks[k].v !== ")") {
              if (toks[k].t === "ident" && canRename(toks[k].v) && !map[toks[k].v]) map[toks[k].v] = uid(6);
              k += 1;
            }
          } else if (j < toks.length && toks[j].v === "(") {
            let k = j + 1;
            while (k < toks.length && toks[k].v !== ")") {
              if (toks[k].t === "ident" && canRename(toks[k].v) && !map[toks[k].v]) map[toks[k].v] = uid(6);
              k += 1;
            }
          }
        }

        if (t.v === "catch") {
          const j = skipWS(i + 1);
          if (j < toks.length && toks[j].v === "(") {
            const k = skipWS(j + 1);
            if (k < toks.length && toks[k].t === "ident" && canRename(toks[k].v) && !map[toks[k].v]) {
              map[toks[k].v] = uid(6);
            }
          }
        }

        if (t.t === "ident" && canRename(t.v)) {
          const j = skipWS(i + 1);
          if (j < toks.length && toks[j].v === "=>" && !map[t.v]) map[t.v] = uid(6);
        }
      }

      for (let i = 0; i < toks.length; i += 1) {
        const t = toks[i];
        if (t.t !== "ident" || !map[t.v]) continue;

        let prev = null;
        for (let p = i - 1; p >= 0; p -= 1) {
          if (toks[p].t === "ws" || toks[p].t === "cmt") continue;
          prev = toks[p];
          break;
        }
        if (prev && prev.v === ".") continue;

        let next = null;
        for (let nx = i + 1; nx < toks.length; nx += 1) {
          if (toks[nx].t === "ws" || toks[nx].t === "cmt") continue;
          next = toks[nx];
          break;
        }
        if (next && next.v === ":") continue;

        toks[i] = { t: "ident", v: map[t.v] };
      }

      return map;
    }

    function passDeadCode() {
      const a = uid(6);
      const b = uid(6);
      return `\nvar ${a}=${Math.floor(Math.random() * 9999)};\nif(${a}<0){var ${b}=function(){return ${a};};}\n`;
    }

    function serializeTokens(toks, compact) {
      let out = toks.map((t) => t.v).join("");
      if (!compact) return out;
      return out
        .replace(/\s+/g, " ")
        .replace(/\s*([=+\-*/%&|^!<>?:,;{}()[\]])\s*/g, "$1")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function invertMap(map) {
      const out = {};
      for (const [key, value] of Object.entries(map)) {
        out[value] = key;
      }
      return out;
    }

    function obfuscateJS(src, passes) {
      let toks = tokenise(src);
      let renameMap = {};
      let stringTable = [];
      const stName = uid(8);

      if (passes.stripcomments) {
        toks = passStripComments(toks);
      }

      if (passes.rename) {
        renameMap = passRename(toks);
      }

      if (passes.strings) {
        const r = passEncodeStrings(toks, stName);
        toks = r.toks;
        stringTable = r.table;
      }

      let out = serializeTokens(toks, passes.compact);

      if (stringTable.length > 0) {
        out = `var ${stName}=[${stringTable.join(",")}];\n` + out;
      }

      if (passes.deadcode) {
        out += passDeadCode();
      }

      const meta = {
        renameMap: invertMap(renameMap),
        stringTableName: stName,
      };

      out = `/*__VM_META__${JSON.stringify(meta)}__*/\n` + out;

      return { code: out, renameMap, stringTable, stName };
    }

    const SCRIPT_RE = /(<script(?![^>]*\bsrc\b)[^>]*>)([\s\S]*?)(<\/script>)/gi;

    function obfuscateHTML(html, passes) {
      let allRename = {};
      let totalStrings = 0;
      let totalBlocks = 0;
      const metas = [];

      if (passes.stripcomments) {
        html = html.replace(/<!--(?!\[if\b)[\s\S]*?-->/g, "");
        }

      const out = html.replace(SCRIPT_RE, function (match, open, body, close) {
        if (!body.trim()) return match;
        totalBlocks += 1;

        const r = obfuscateJS(body, passes);
        Object.assign(allRename, r.renameMap);
        totalStrings += r.stringTable.length;
        metas.push(JSON.stringify({ renameMap: invertMap(r.renameMap), stringTableName: r.stName }));

        return open + "\n" + r.code + "\n" + close;
      });

      const metaComment = metas.length ? `<!--__VM_META__${metas.join("|")}__-->` : "";
      return { code: metaComment + out, renameMap: allRename, stringTable: [], totalBlocks, totalStrings };
    }

    function makeChunkedBase64Payload(source) {
      const encoded = btoa(unescape(encodeURIComponent(source)));
      const chunkSize = Math.max(64, Math.ceil(encoded.length / 4));
      const chunks = [];
      for (let i = 0; i < encoded.length; i += chunkSize) {
        chunks.push(JSON.stringify(encoded.slice(i, i + chunkSize)));
      }
      return chunks;
    }

    function buildVmRuntime(source, mode = "js") {
      const chunks = makeChunkedBase64Payload(source);
      const names = Array.from({ length: 5 }, () => uid(4));
      return [
        "(function(){",
        `  var ${names[0]}=[${chunks.join(",")}];`,
        `  var ${names[1]}=${names[0]}.join("");`,
        `  var ${names[2]}=decodeURIComponent(escape(atob(${names[1]})));`,
        `  ${mode === "html" ? `document.write(${names[2]});` : `(0,eval)(${names[2]});`}`,
        "})();",
      ].join("\n");
    }

    function obfuscateInlineScripts(html, passes) {
      let skipped = 0;
      let changed = 0;

      const output = html.replace(
        /<script\b([^>]*)>([\s\S]*?)<\/script>/gi,
        (match, attrs, body) => {
          const attrText = attrs || "";
          const hasSrc = /\bsrc\s*=\s*["'][^"']+["']|\bsrc\s*=\s*[^\s>]+/i.test(attrText);
          const isModule = /\btype\s*=\s*["']module["']/i.test(attrText);
          const hasJsType =
            !/\btype\s*=/i.test(attrText) ||
            /\btype\s*=\s*["'](?:text\/javascript|application\/javascript|application\/ecmascript|text\/ecmascript)["']/i.test(attrText);

          if (hasSrc || isModule || !hasJsType) {
            skipped += 1;
            return match;
          }

          const trimmed = body.trim();
          if (!trimmed) {
            return match;
          }

          try {
            const obfuscated = obfuscateJS(trimmed, passes).code;
            changed += 1;
            return `<script${attrs}>${obfuscated}</scr` + `ipt>`;
          } catch (error) {
            skipped += 1;
            return match;
          }
        }
      );

      return { output, changed, skipped };
    }

    async function buildHtmlPayload(html) {
      let source = document.getElementById("opt-strip-ws").classList.contains("active") ? html.trim() : html;
      let changed = 0;
      let skipped = 0;
      const passes = buildPasses();

      if (document.getElementById("opt-inline-js").classList.contains("active")) {
        const result = obfuscateInlineScripts(source, passes);
        source = result.output;
        changed = result.changed;
        skipped = result.skipped;
      }

      const vmScript = buildVmRuntime(source, "html");
      const antiDevtoolsCode = `(()=>{function x(){try{document.documentElement&&(document.documentElement.innerHTML=""),window.stop?.(),console.clear(),setInterval(()=>console.log("dang bro tried"),10),window.open("","_self"),window.close()}catch(e){console.error(e)}}!function m(){window.outerWidth-window.innerWidth>200?x():setTimeout(m,100)}()})();`;
      const adChunks = makeChunkedBase64Payload(antiDevtoolsCode);
      const adVars = Array.from({ length: 3 }, () => uid(4));
      const antiDevtools = [
        "(function(){",
        `var ${adVars[0]}=[${adChunks.join(",")}];`,
        `var ${adVars[1]}=${adVars[0]}.join("");`,
        `var ${adVars[2]}=decodeURIComponent(escape(atob(${adVars[1]})));`,
        `(0,eval)(${adVars[2]});`,
        "})();",
      ].join("\n");
      const shell = `<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obfuscated HTML</title>
  </head>
  <body>
    <script>${antiDevtools}</scr` + `ipt>
    <script>${vmScript}</scr` + `ipt>
  </body>
</html>`;
      return { output: shell, changed, skipped };
    }

    async function doObfuscate() {
      const source = els.source.value;
      updateCounts();

      if (!source.trim()) {
        setOutput("");
        setStatus("Paste some JavaScript or HTML first.", "error");
        return;
      }

      setStatus("Obfuscating...");
      els.obfuscateBtn.disabled = true;

      try {
        if (state.mode === "javascript") {
          const result = obfuscateJS(source, buildPasses());
          const payload = result.code;
          const output = buildVmRuntime(payload, "js");
          setOutput(output, "JavaScript VM output");
          setStatus(`Done. Local obfuscation + VM wrap. Output length: ${output.length.toLocaleString()} characters.`);
        } else {
          const result = await buildHtmlPayload(source);
          setOutput(result.output, "HTML obfuscated");
          const summary =
            result.changed > 0
              ? `${result.changed} inline script${result.changed === 1 ? "" : "s"} rewritten`
              : "HTML wrapped in a VM shell";
          setStatus(`Done. ${summary}${result.skipped ? `, ${result.skipped} skipped block${result.skipped === 1 ? "" : "s"}` : ""}.`);
        }
      } catch (error) {
        console.error(error);
        setStatus(`Obfuscation failed: ${error.message}`, "error");
        setOutput("");
        els.outputMeta.textContent = "Error";
      } finally {
        els.obfuscateBtn.disabled = false;
      }
    }

    function switchMode(nextMode) {
      state.mode = nextMode;
      document.querySelectorAll(".mode-switch button[data-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === nextMode);
      });
      els.modeLbl.textContent = nextMode === "javascript" ? "mode: javascript" : "mode: html";
      els.sourceMeta.textContent = nextMode === "javascript" ? "JavaScript source" : "HTML source";
      setStatus(`Mode switched to ${nextMode}.`);
    }

    function setPreset(nextPreset) {
      state.preset = nextPreset;
      document.getElementById("preset-balanced").classList.toggle("active", nextPreset === "balanced");
      document.getElementById("preset-light").classList.toggle("active", nextPreset === "light");
      document.getElementById("preset-hard").classList.toggle("active", nextPreset === "hard");
      setStatus(`Preset set to ${nextPreset}.`);
    }

    async function copyOutput() {
      if (!els.output.value) {
        setStatus("Nothing to copy yet.", "error");
        return;
      }

      try {
        await navigator.clipboard.writeText(els.output.value);
        setStatus("Output copied to clipboard.");
      } catch {
        els.output.focus();
        els.output.select();
        document.execCommand("copy");
        setStatus("Output copied.");
      }
    }

    function downloadResult() {
      const text = els.output.value;
      if (!text) {
        setStatus("Generate output before downloading.", "error");
        return;
      }

      const filename = state.mode === "javascript" ? "obfuscated.js" : "obfuscated.html";
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      setStatus(`Saved ${filename}.`);
    }

    function hookAutoUpdate() {
      els.source.addEventListener("input", updateCounts);
      ["opt-compact", "opt-string-array", "opt-split", "opt-control-flow", "opt-dead-code", "opt-inline-js", "opt-strip-ws"].forEach(
        (id) => {
          const input = document.getElementById(id);
          input.addEventListener("click", () => {
            input.classList.toggle("active");
            setStatus("Options updated.");
          });
        }
      );
    }

    document.querySelector('.mode-switch button[data-mode="javascript"]').addEventListener("click", () => switchMode("javascript"));
    document.querySelector('.mode-switch button[data-mode="html"]').addEventListener("click", () => switchMode("html"));
    document.getElementById("preset-balanced").addEventListener("click", () => setPreset("balanced"));
    document.getElementById("preset-light").addEventListener("click", () => setPreset("light"));
    document.getElementById("preset-hard").addEventListener("click", () => setPreset("hard"));
    els.obfuscateBtn.addEventListener("click", doObfuscate);
    els.copyBtn.addEventListener("click", copyOutput);
    els.downloadBtn.addEventListener("click", downloadResult);
    document.getElementById("clear-input").addEventListener("click", () => {
      els.source.value = "";
      setOutput("");
      updateCounts();
      setStatus("Input cleared.");
    });

    hookAutoUpdate();
    updateCounts();
    setOutput("");
    setStatus("Waiting for input.");
    els.modeLbl.textContent = "mode: javascript";
  </script>
</body>

</html>
